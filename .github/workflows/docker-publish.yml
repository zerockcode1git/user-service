name: Build and Push Docker Image

on:
 push:
   branches:
     - main
   tags:
     - 'v*.*.*'

env:
 IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/user-service
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 이 줄 추가
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   permissions:
     contents: write

   steps:
     - name: Checkout source
       uses: actions/checkout@v4


     - name: Set up QEMU (multi-platform emulation)
       uses: docker/setup-qemu-action@v3

     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3

     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}


     - name: Extract Docker metadata
       id: meta
       uses: docker/metadata-action@v5
       with:
         images: ${{ env.IMAGE_NAME }}
         tags: |
           type=ref,event=branch
           type=semver,pattern={{version}}
           type=semver,pattern={{major}}.{{minor}}
           type=sha,prefix=sha-,format=short

     - name: Build and push multi-platform image
       uses: docker/build-push-action@v6
       with:
         context: .
         push: true
         platforms: linux/amd64,linux/arm64
         tags: ${{ steps.meta.outputs.tags }}
         labels: ${{ steps.meta.outputs.labels }}
         cache-from: type=gha
         cache-to: type=gha,mode=max

     - name: Update deployment image tag
       if: github.event_name == 'push' && github.ref == 'refs/heads/main'
       run: |
         SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
         NEW_IMAGE="${{ env.IMAGE_NAME }}:${SHA_TAG}"
         sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${NEW_IMAGE}|" k8s/deployment.yaml
         echo "Updated image to: ${NEW_IMAGE}"

     - name: Commit and push updated deployment
       if: github.event_name == 'push' && github.ref == 'refs/heads/main'
       run: |
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add k8s/deployment.yaml
         git diff --staged --quiet || git commit -m "ci: update image to sha-$(echo ${{ github.sha }} | cut -c1-7)"
         git push
