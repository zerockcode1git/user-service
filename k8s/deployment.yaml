apiVersion: apps/v1
kind: Deployment
metadata:
 name: user-service
 namespace: user-service
 labels:
   app: user-service
spec:
 replicas: 2
 selector:
   matchLabels:
     app: user-service
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
 template:
   metadata:
     labels:
       app: user-service

   spec:
     containers:
       - name: user-service
         image: zerockcode1/user-service:sha-42296ab
         imagePullPolicy: Always
         ports:
           - containerPort: 8082
         envFrom:
           - configMapRef:
               name: user-service-config
           - secretRef:
               name: user-service-secret
         resources:
           requests:
             cpu: "100m"
             memory: "256Mi"
           limits:
             cpu: "500m"
             memory: "512Mi"
         livenessProbe:
           httpGet:
             path: /actuator/health/liveness
             port: 8082
           initialDelaySeconds: 30
           periodSeconds: 15
           failureThreshold: 3
         readinessProbe:
           httpGet:
             path: /actuator/health/readiness
             port: 8082
           initialDelaySeconds: 20
           periodSeconds: 10
           failureThreshold: 3
     terminationGracePeriodSeconds: 30
