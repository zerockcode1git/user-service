apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-secret-configuration
  namespace: user-service
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: aws-parameterstore-store # 위에서 만든 SecretStore 이름 조준!
    kind: ClusterSecretStore
  target:
    name: user-service-secret # 최종적으로 내 앱이 읽게 될 K8s 시크릿 이름
  data:
    - secretKey: TEST_TITLE
      remoteRef:
        key: /user-service/title #  SSM에 생성한 파라미터 경로

    - secretKey: AWS_TITLE
      sourceRef:
        storeRef:
          name: aws-secretsmanager-store # 이 항목만 Secrets Manager에서 조회
          kind: ClusterSecretStore
      remoteRef:
        key: prod/my-msa # Secrets Manager에 생성한 시크릿 이름
        property: sm/user-service/title # JSON 안에서 사용할 필드
