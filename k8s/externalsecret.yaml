apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
 name: user-service-secret-configuration
 namespace: user-service
spec:
 refreshInterval: "24h" # 💡 비용 절감을 위해 체크 주기는 여유롭게 24시간으로 둡니다.
 secretStoreRef:
   name: aws-parameterstore-store # 위에서 만든 SecretStore 이름 조준!
   kind: ClusterSecretStore
 target:
   name: user-service-secret # 최종적으로 내 앱이 읽게 될 K8s 시크릿 이름
 data:
 - secretKey: TEST_SECRET
   remoteRef:
     key: /user-service/title #  SSM에 생성한 파라미터 경로
