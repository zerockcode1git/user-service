apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
 name: user-service-secret-configuration
 namespace: user-service
spec:
 refreshInterval: "24h" # 💡 비용 절감을 위해 체크 주기는 여유롭게 24시간으로 둡니다.
 secretStoreRef:
   name: aws-parameterstore-store # 위에서 만든 SecretStore 이름 조준!
   kind: ClusterSecretStore
 target:
   name: user-service-secret # 최종적으로 내 앱이 읽게 될 K8s 시크릿 이름
 data:
 - secretKey: TEST_SECRET
   remoteRef:
     key: /user-service/title #  SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_BOOTSTRAP_SERVERS
   remoteRef:
     key: /kafka/bootstrap-servers # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_KEY_PASSWORD
   remoteRef:
     key: /kafka/key-password # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_KEYSTORE_PASSWORD
   remoteRef:
     key: /kafka/keystore-password # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_TRUST_PASSWORD
   remoteRef:
     key: /kafka/trust-password # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_TRUSTSTORE
   remoteRef:
     key: /kafka/truststore  # 파라미터 스토어에서 truststore.jks를 base64로 인코딩한 값
 - secretKey: KAFKA_KEYSTORE
   remoteRef:
     key: /kafka/keystore  # 파라미터 스토어에서 keystore.jks를 base64로 인코딩한 값
 - secretKey: DB_URL
   remoteRef:
     key: /user-service/db_url
 - secretKey: DB_USERNAME
   remoteRef:
     key: /user-service/db_username
 - secretKey: DB_PASSWORD
   remoteRef:
     key: /user-service/db_password
 - secretKey: JWT_SECRET
   remoteRef:
     key: /jwt/secret
     
 - secretKey: REDIS_HOST
   remoteRef:
     key: /redis/host

 - secretKey: REDIS_PORT
   remoteRef:
     key: /redis/port

 - secretKey: REDIS_PASSWORD
   remoteRef:
     key: /redis/password
